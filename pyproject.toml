[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a5dd"
version = "0.3.0"
description = "A5 Due Diligence Agent for Ethical Partnerships (Team Glacier, The Water Challenge)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6", "python-docx>=1.1", "beautifulsoup4>=4.12", "pypdf>=4.0", "reportlab>=4.0"]

[project.optional-dependencies]
live = ["anthropic>=0.40", "openai>=1.40", "httpx>=0.27", "ddgs>=9.0"]   # AI agents + live web
app = ["streamlit>=1.35", "pandas>=2"]                                    # review screen
dev = ["pytest>=8", "httpx>=0.27"]                                        # tests

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
